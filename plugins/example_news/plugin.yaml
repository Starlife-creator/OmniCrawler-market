# 插件清单源（git-as-registry：目录结构即索引）
#
# 本文件是插件 example_news 在生态中的唯一元数据源。catalog.json
# 由 tools/generate_catalog.py 从 plugins/*/plugin.yaml 聚合生成，
# 提交/更新插件时只需改本文件，再运行生成器（或依赖 CI 校验一致）。
#
# 所有 *_file 路径均为相对于本仓库（生态目录根）的相对路径，保持与
# catalog.json 相同的迁移友好约定（整个生态目录可整体搬运）。
#
# 字段说明见 CATALOG_SCHEMA.md。

id: example_news
name: 示例新闻站点适配器
version: 1.0.0
# B02-028：author_fingerprint 按 templates/README.md 规范填【创作者公钥指纹】。
# 本插件创作者为 starlife（creator.identity 指向 4c30…），publisher 与之一致；
# 维护者 starlife-creator 用信任根冷密钥对 plugin.py.sig 背书（独立身份）。
publisher: starlife
author_fingerprint: 4c3014804d85de2568f85e62a3048429
category: source
summary: 为示例新闻站点强制附加 XHR 请求头并打站点标记，复用通用发现逻辑。
description_file: plugins/example_news/listing.md
plugin_file: plugins/example_news/plugin.py
signature_file: plugins/example_news/plugin.py.sig
signature_algorithm: ed25519
# 创作者轨：starlife（用户身份）对 plugin.py 的签名与公钥身份。
# 与签名轨（维护者 starlife-creator 背书）是两个独立身份、各自验签。
creator_signature_file: plugins/example_news/creator.sig
creator_identity_file: plugins/example_news/creator.identity
permissions: []
compatible_core: ">=0.7.0"
license: MIT
# Phase 2a：契约 2 子进程样板——显式声明 subprocess（缺省亦为 subprocess，
# 显式声明作样板意图说明）。契约 2 handle 形态运行于隔离沙箱。
execution_mode: subprocess
tags: [example, source, news, template, contract2]
updated_at: "2026-08-21"
homepage: https://github.com/Starlife-creator/OmniCrawler-market/tree/main/plugins/example_news
# scan_plugin 允许列表（发布前扫描：清单声明之外的文件 → 报错）。
# .sig/.md/.pyc 等由扫描器 SKIP_SUFFIXES 排除，无需声明。
files:
  - plugin.py
  - plugin.yaml
  - creator.identity

