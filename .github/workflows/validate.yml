name: validate

# 独立仓库 CI（拆库后生效）：把本文件复制到独立仓库根 .github/workflows/ 即用。
# 校验插件清单合法、与 catalog.json 一致、作者指纹匹配、签名有效。

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "plugins/**"
      - "authors/**"
      - "templates/**"
      - "keys/**"
      - "tools/**"
      - "catalog.json"
  pull_request:
    paths:
      - "plugins/**"
      - "authors/**"
      - "templates/**"
      - "keys/**"
      - "tools/**"
      - "catalog.json"

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # P3-6：与主仓同规格——PyYAML 对齐主仓 quality.txt 精确 pin；
      # cryptography 对齐 pyproject security extra 上限，防验签行为随大版本漂移
      - run: python -m pip install "PyYAML==6.0.2" "cryptography>=44,<51"
      - name: Catalog 一致性 + 签名校验
        run: python tools/generate_catalog.py --check
      - name: 发布前安全扫描（全部插件）
        run: |
          for plugin_dir in plugins/*/; do
            if [ -f "$plugin_dir/plugin.py" ]; then
              # P3-2：显式传 --manifest，启用「允许列表外文件 → 报错」；
              # 此前不传时 _scan_allowlist 收 manifest=None 直接跳过，门禁空转
              python tools/scan_plugin.py scan "$plugin_dir" --manifest "$plugin_dir/plugin.yaml" || exit 1
            fi
          done
      - name: 发布前安全扫描（全部模板）
        run: |
          for tpl_dir in templates/*/; do
            if [ -f "$tpl_dir/template.yaml" ]; then
              python tools/scan_plugin.py scan "$tpl_dir" --manifest "$tpl_dir/template.yaml" || exit 1
            fi
          done
