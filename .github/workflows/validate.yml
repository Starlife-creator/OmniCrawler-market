name: validate

# 独立仓库 CI（拆库后生效）：把本文件复制到独立仓库根 .github/workflows/ 即用。
# 校验插件清单合法、与 catalog.json 一致、作者指纹匹配、签名有效。

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "authors/**"
      - "templates/**"
      - "keys/**"
      - "tools/**"
      - "catalog.json"
      - "catalog.json.sig"
      - "submissions/**"
  pull_request:
    paths:
      - "plugins/**"
      - "authors/**"
      - "templates/**"
      - "keys/**"
      - "tools/**"
      - "catalog.json"
      - "catalog.json.sig"
      - "submissions/**"

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: CI trigger policy
        run: python tools/check_workflow_policy.py
      - run: python -m pip install --upgrade pip
      # P3-6：与主仓同规格——PyYAML 对齐主仓 quality.txt 精确 pin；
      # cryptography 对齐 pyproject security extra 上限，防验签行为随大版本漂移
      - run: python -m pip install "PyYAML==6.0.2" "cryptography>=44,<51"
      - name: Plugin schema policy
        run: python tools/check_plugin_schema_policy.py
      - name: Catalog 一致性 + 签名校验
        run: python tools/generate_catalog.py --check
      - name: 投稿包静态验证（不执行投稿代码）
        run: python tools/validate_submission.py
      - name: 凭据扫描器回归检查
        run: python tools/check_scan_plugin.py
      - name: DCO（仅 Pull Request）
        if: github.event_name == 'pull_request'
        run: >-
          python tools/check_dco.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: 正式发布门禁（发布目录发生变化时）
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python tools/generate_catalog.py --publish-check
          elif ! git diff --quiet "${{ github.event.pull_request.base.sha }}"...HEAD -- plugins templates authors catalog.json catalog.json.sig; then
            python tools/generate_catalog.py --publish-check
          else
            echo "仅投稿材料变化：正式发布门禁留待维护者发布提交。"
          fi
      - name: 多版本扫描回归检查
        run: python tools/check_scan_market.py
      - name: 发布前安全扫描（全部插件、模板及历史版本）
        run: python tools/scan_market.py
