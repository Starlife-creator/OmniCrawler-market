name: validate

# 独立仓库 CI（拆库后生效）：把本文件复制到独立仓库根 .github/workflows/ 即用。
# 校验插件清单合法、与 catalog.json 一致、作者指纹匹配、签名有效。
#
# ★ paths 必须覆盖「PR 可能改动的全部路径」，否则 required check `validate-catalog`
#   永远不会上报，PR 会**永久卡在 blocked**（不是失败，是永远等不到结果）。
#   实测（2026-09-28）：dependabot 的 `chore(ci): bump actions/*` PR 只改
#   `.github/workflows/**`，而 paths 不含该目录 ⇒ 三个 PR 拿不到任何 CI、
#   无法正常合并。故把 `.github/**` 纳入触发面。
#   `permissions` 显式收到 `contents: read`：本工作流只读，workflow 文件自身的
#   改动也在触发面内，最小权限是必须的。

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "authors/**"
      - "templates/**"
      - "keys/**"
      - "tools/**"
      - "catalog.json"
      - "catalog.json.sig"
      - "submissions/**"
      - ".github/**"
  pull_request:
    paths:
      - "plugins/**"
      - "authors/**"
      - "templates/**"
      - "keys/**"
      - "tools/**"
      - "catalog.json"
      - "catalog.json.sig"
      - "submissions/**"
      - ".github/**"

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: CI trigger policy
        run: python tools/check_workflow_policy.py
      - run: python -m pip install --upgrade pip
      # P3-5：PyYAML 与 cryptography 均精确钉版（50.0.1 为本仓回归实测版本），
      # 禁止区间漂移导致验签行为随次版本变化；pytest 仅测试运行器，不进入运行时依赖。
      - run: python -m pip install "PyYAML==6.0.2" "cryptography==50.0.1" "pytest==8.3.3"
      - name: 工具链 pytest 回归（schema/路径/墓碑负样例）
        run: python -m pytest tools/tests -q
      - name: Plugin schema policy
        run: python tools/check_plugin_schema_policy.py
      - name: Catalog 一致性 + 签名校验
        run: python tools/generate_catalog.py --check
      - name: 发现页渲染回归检查（转义/计数/零外部子资源/fail-closed）
        run: python tools/check_discovery_page.py
      - name: 投稿包静态验证（不执行投稿代码）
        run: python tools/validate_submission.py
      - name: 凭据扫描器回归检查
        run: python tools/check_scan_plugin.py
      - name: 透明日志 POSIX 归一与 v2 哈希链复核（P3-11/P2-5）
        run: python tools/check_transparency.py
      - name: DCO（仅 Pull Request；机器账号不适用）
        if: github.event_name == 'pull_request'
        run: >-
          python tools/check_dco.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --author "${{ github.event.pull_request.user.login }}"
      - name: DCO 门禁回归检查（机器账号豁免不得泄漏）
        run: python tools/check_dco_regression.py
      - name: 正式发布门禁（发布目录发生变化时）
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python tools/generate_catalog.py --publish-check
          elif ! git diff --quiet "${{ github.event.pull_request.base.sha }}"...HEAD -- plugins templates authors catalog.json catalog.json.sig; then
            python tools/generate_catalog.py --publish-check
          else
            echo "仅投稿材料变化：正式发布门禁留待维护者发布提交。"
          fi
      - name: 多版本扫描回归检查
        run: python tools/check_scan_market.py
      - name: 发布前安全扫描（全部插件、模板及历史版本）
        run: python tools/scan_market.py
