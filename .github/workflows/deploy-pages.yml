name: deploy-pages

# §10.12 Web 发现页：push main ⇒ fail-closed 验签 catalog ⇒ 生成静态发现页 ⇒ 部署 Pages。
# 安全语义：生成器先验 catalog.json.sig（信任根公钥），验签失败拒绝生成——
# 被篡改的目录永远上不了 Pages。动作全部钉 commit SHA（与 validate.yml 同惯例）。

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # 与 validate.yml 同规格：PyYAML 精确 pin（signing.py 依赖）、cryptography 对齐上限
      - run: python -m pip install "PyYAML==6.0.2" "cryptography>=44,<51"
      - name: Fail-closed 验签并生成发现页
        run: python tools/generate_discovery_page.py --output _pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
