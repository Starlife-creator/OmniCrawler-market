id: pdf-workbench
name: PDF Workbench
version: 1.0.0
api_version: 1
description: 十万级 PDF 结构化数据抽取工作台——摄取、解析、OCR、字段抽取、复核与五表导出
plugin_types:
- processor
- exporter
category: document-processing
tags:
- pdf
- ocr
- extraction
- table
- workbench
permissions: []
domains: []
input_files: []
dependencies:
- name: omnicrawler_pdf
  version: '1.0.0'
  license: Apache-2.0
- name: yaml
  version: '>=6.0,<7.0'
  license: MIT
license: Apache-2.0
# 契约 1：PDF 工作台必须自由读写用户指定的项目目录（读 PDF、写五表、建 SQLite），
# 而契约 2 的 files.read / artifact.stream / temp.open 没有一条能覆盖这三件事。
# 契约 1 的语义正是「经单独审批的受信任本地扩展」，运行于宿主进程内。
#
# 代价：无子进程隔离，且不接受公共市场投稿（见 docs/PLUGIN_CONTRACT.md）。
# 安装时需要逐台机器审批：plugins.in_process_allowlist（带 expires）
# 且插件须位于 plugins.trusted_local_dirs 内，否则 fail-closed 降级 subprocess。
execution_mode: in_process
min_core_version: 1.0.2
compatible_core: '>=1.0.2'
updated_at: '2026-11-17'
